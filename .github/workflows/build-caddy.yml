name: 'Build custom Caddy Docker image'

on:
  workflow_dispatch:
    inputs:
      caddy_modules:
        description: 'Caddy modules to include (space-separated)'
        required: true
        default: 'github.com/caddy-dns/cloudflare github.com/greenpau/caddy-security github.com/mholt/caddy-l4/layer4'
      docker_image_name:
        description: 'Docker image name'
        required: true
        default: 'caddy'

env:
  DOCKER_IMAGE: ${{ vars.DOCKERHUB_LOGIN }}/${{ github.event.inputs.docker_image_name }}

jobs:
  build-and-push:
    name: 'Build and push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v5

      - name: 'Get latest Caddy version'
        id: get_caddy_version
        run: |
          LATEST_TAG=$(curl -s "https://api.github.com/repos/caddyserver/caddy/releases/latest" | jq -r .tag_name)
          VERSION=${LATEST_TAG#v}
          echo "Latest Caddy release: ${LATEST_TAG}"
          echo "CADDY_VERSION_TAG=${VERSION}" >> $GITHUB_ENV
          echo "CADDY_VERSION_FULL=${LATEST_TAG}" >> $GITHUB_ENV

      - name: 'Setup QEMU'
        uses: docker/setup-qemu-action@v3

      - name: 'Setup Docker Buildx'
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: 'Login to Docker Hub'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 'Extract metadata'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=${{ env.CADDY_VERSION_TAG }}-alpine
            type=raw,value=latest

      - name: 'Build and push Caddy image'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CADDY_VERSION=${{ env.CADDY_VERSION_TAG }}
            CADDY_MODULES=${{ github.event.inputs.caddy_modules }}

      - name: 'Summary'
        run: |
          echo "## ✅ Caddy image build complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Caddy version:** \`${{ env.CADDY_VERSION_FULL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.DOCKER_IMAGE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "  - \`${{ env.DOCKER_IMAGE }}:${{ env.CADDY_VERSION_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "  - \`${{ env.DOCKER_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Modules Included:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ github.event.inputs.caddy_modules }}" | sed 's/ /\n/g' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
